name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # ruff + mypy (config in pyproject.toml; core dependencies are installed for their types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[lint]"
      - run: ruff check .
      - run: mypy

  pytest:
    # A regular (non-editable) install, so the tests run against the package as
    # pip installs it. No torch: the tests stub the model calls (checked by
    # running the suite with torch, transformers and sentence-transformers absent).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Console script
        run: clipweaver --help
      - name: pytest
        run: pytest -q

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmaker"
version = "0.1.0"
description = "Pre-production assistant for game video essays: a searchable VLM catalog of your own footage and a narration-driven storyboard for the editor."
requires-python = ">=3.11"
license = { text = "MIT" }
# Core: catalog search by text, storyboard, alignment, layout for the editor.
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "PyYAML>=6",
    "requests>=2.31",
]

[project.scripts]
# One command for every tool: clipweaver <tool> [args] == python -m clipmaker.<tool> [args]
clipweaver = "clipmaker.cli:main"

[project.optional-dependencies]
# Stage 1: video -> catalog JSON with a local vision-language model (CUDA GPU).
# Install torch from the PyTorch index that matches your CUDA first.
vlm = [
    "torch>=2.3",
    # The catalog is built with 4.57.6 (constraints.txt). 4.56 is the first with
    # both AutoModelForImageTextToText and the dtype= kwarg; 5.x is not verified
    # on a GPU yet, so it stays outside the range until it is.
    "transformers>=4.57,<5",
    # accelerate: device_map; bitsandbytes: the 4-bit NF4 quantization config.
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "qwen-vl-utils>=0.0.8",
]
# On-screen text in the catalog (HUD, place and item names, numbers).
ocr = ["easyocr>=1.7", "opencv-python-headless>=4.8"]
# Semantic search over the catalog (multilingual E5 embeddings).
search = ["sentence-transformers>=3.0"]
# Narration and source-video transcription.
transcribe = ["faster-whisper>=1.0"]
# YouTube search and remote stills.
youtube = ["yt-dlp>=2024.1"]
# Timeline export to DaVinci Resolve (OpenTimelineIO; the FCPXML needs nothing).
resolve = ["opentimelineio>=0.17"]
all = ["clipmaker[vlm,ocr,search,transcribe,youtube,resolve]"]
test = ["pytest>=8", "opentimelineio>=0.17"]
# Lint and type checks, pinned so CI and a local run agree.
lint = ["ruff==0.8.6", "mypy==2.4.1", "types-requests", "types-PyYAML"]

[tool.setuptools]
packages = ["clipmaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: reads the real catalog/projects instead of the per-test tmp folders"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pyflakes + the pycodestyle errors ruff checks by default, bugbear, pyupgrade, bandit
select = ["E4", "E7", "E9", "F", "B", "UP", "S"]
ignore = [
    # The tools wrap ffmpeg, ffprobe and yt-dlp: argument lists, never a shell,
    # binaries found on PATH by design (the user installs them).
    "S603", "S607",
    # isinstance(x, (A, B)) -> A | B: deprecated in later ruff, and slower.
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; the FCPXML test parses the file this package just wrote.
"tests/*" = ["S101", "S314"]

[tool.mypy]
python_version = "3.11"
files = ["clipmaker"]
warn_unused_ignores = true
warn_redundant_casts = true

# Optional extras: heavy (torch, CUDA) or untyped. The core dependencies are
# checked with their own types or stubs (types-requests, types-PyYAML).
[[tool.mypy.overrides]]
module = [
    "torch", "torch.*", "transformers", "transformers.*", "qwen_vl_utils",
    "easyocr", "cv2", "sentence_transformers", "faster_whisper",
    "opentimelineio", "opentimelineio.*", "yt_dlp",
]
ignore_missing_imports = true
